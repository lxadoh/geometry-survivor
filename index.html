<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1022">
<meta name="description" content="极简几何风幸存者like小游戏：走位求生、自动战斗、升级三选一，你能活过 10 分钟吗？">
<meta property="og:title" content="几何幸存者 Geometry Survivor">
<meta property="og:description" content="极简几何风幸存者like小游戏：走位求生、自动战斗、升级三选一，你能活过 10 分钟吗？">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lxadoh.github.io/geometry-survivor/">
<meta property="og:image" content="https://lxadoh.github.io/geometry-survivor/icon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="几何幸存者 Geometry Survivor">
<meta name="twitter:description" content="极简几何风幸存者like小游戏：走位求生、自动战斗、升级三选一，你能活过 10 分钟吗？">
<meta name="twitter:image" content="https://lxadoh.github.io/geometry-survivor/icon.png">
<title>几何幸存者 Geometry Survivor</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="css/style.css?v=4.1">
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="damage-flash"></div>

<div id="hud" class="hidden">
  <div id="hud-top">
    <div id="hp-wrap"><div id="hp-fill"></div><span id="hp-text">100</span></div>
    <div id="hud-right">
      <div class="hud-right-text">
        <div id="hud-time">00:00</div>
        <div id="hud-kills">击杀 0</div>
      </div>
      <button id="btn-pause" aria-label="暂停">⏸</button>
    </div>
  </div>
  <div id="boss-bar-wrap" class="hidden">
    <div id="boss-name"></div>
    <div id="boss-bar"><div id="boss-fill"></div></div>
  </div>
  <div id="boss-warn" class="hidden">⚠ 警告 ⚠</div>
  <div id="level-badge">LV 1</div>
  <div id="xp-wrap"><div id="xp-fill"></div></div>
</div>

<div id="screen-start" class="screen">
  <div class="logo-circle"></div>
  <h1 class="title">几何幸存者</h1>
  <div class="subtitle">GEOMETRY SURVIVOR</div>
  <div id="best-line" class="best-line"></div>
  <button id="btn-start" class="btn btn-primary">开始游戏</button>
  <div class="pause-vol menu-vol">
    <span class="pv-label">音量</span>
    <input type="range" id="vol-slider-menu" min="0" max="100" step="1" value="85" aria-label="音量">
  </div>
  <div class="hint">电脑：WASD / 方向键移动<br>手机：按住屏幕任意位置拖动</div>
  <div class="screen-footer">武器自动攻击 · 你只管走位求生</div>
</div>

<div id="screen-upgrade" class="screen hidden">
  <div class="up-header">— 升级 —</div>
  <div class="up-sub">选择一项强化</div>
  <div id="cards"></div>
</div>

<div id="screen-pause" class="screen hidden">
  <div class="up-header pause-title">— 暂停 —</div>
  <div id="pause-build" class="pause-build"></div>
  <div class="pause-vol">
    <span class="pv-label">音量</span>
    <input type="range" id="vol-slider" min="0" max="100" step="1" value="70" aria-label="音量">
  </div>
  <div class="over-btns">
    <button id="btn-resume" class="btn btn-primary">继续游戏</button>
    <button id="btn-lobby" class="btn btn-ghost">回到大厅</button>
  </div>
</div>

<div id="screen-over" class="screen hidden">
  <div class="over-title">你倒下了</div>
  <div id="new-best" class="new-best hidden">★ 新纪录 ★</div>
  <div class="over-stats">
    <div class="stat"><div class="stat-num" id="ov-time">00:00</div><div class="stat-label">存活时间</div></div>
    <div class="stat"><div class="stat-num" id="ov-kills">0</div><div class="stat-label">击杀</div></div>
    <div class="stat"><div class="stat-num" id="ov-level">1</div><div class="stat-label">等级</div></div>
  </div>
  <div id="ov-best" class="over-best"></div>
  <div id="ov-runs" class="ov-runs"></div>
  <div class="over-btns">
    <button id="btn-retry" class="btn btn-primary">再来一局</button>
    <button id="btn-home" class="btn btn-ghost">回首页</button>
  </div>
  <div class="screen-footer">成绩保存在本浏览器（清缓存会丢失）</div>
</div>

<div id="rotate-prompt">
  <svg class="rp-icon" viewBox="0 0 48 48" width="72" height="72" fill="none" stroke="#7ee787" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="15" y="6" width="18" height="36" rx="3.5"/>
    <circle cx="24" cy="36.5" r="1.4" fill="#7ee787" stroke="none"/>
    <path d="M6 30 A18 18 0 0 1 10 17"/>
    <path d="M10 17 l0.4 5 5-0.6"/>
    <path d="M42 18 A18 18 0 0 1 38 31"/>
    <path d="M38 31 l-0.4-5 -5 0.6"/>
  </svg>
  <div class="rp-title">请横屏游玩</div>
  <div class="rp-sub">旋转手机至横向 · 游戏已自动暂停</div>
</div>

<button id="btn-fullscreen" aria-label="全屏">⛶</button>
<button id="btn-mute" aria-label="音效开关">🔊</button>

<script src="js/data/config.js?v=4.1"></script>
<script src="js/core/util.js?v=4.1"></script>
<script src="js/core/pool.js?v=4.1"></script>
<script src="js/core/input.js?v=4.1"></script>
<script src="js/core/camera.js?v=4.1"></script>
<script src="js/core/save.js?v=4.1"></script>
<script src="js/core/audio.js?v=4.1"></script>
<script src="js/core/bgm.js?v=4.1"></script>
<script src="js/world/background.js?v=4.1"></script>
<script src="js/entities/particle.js?v=4.1"></script>
<script src="js/entities/gem.js?v=4.1"></script>
<script src="js/entities/bullet.js?v=4.1"></script>
<script src="js/entities/enemy.js?v=4.1"></script>
<script src="js/entities/boss.js?v=4.1"></script>
<script src="js/entities/player.js?v=4.1"></script>
<script src="js/weapons/weapons.js?v=4.1"></script>
<script src="js/ui/hud.js?v=4.1"></script>
<script src="js/ui/screens.js?v=4.1"></script>
<script src="js/ui/upgrade.js?v=4.1"></script>
<script src="js/core/game.js?v=4.1"></script>
<script src="js/main.js?v=4.1"></script>
</body>
</html>
